# Admin UI — отдельный compose-проект, только через edge Caddy.
# Prod: COMPOSE_PROJECT_NAME=smartprice-admin API_EDGE_ALIAS=smartprice-admin
# Dev:  COMPOSE_PROJECT_NAME=smartprice-admin-dev API_EDGE_ALIAS=smartprice-admin-dev
name: ${COMPOSE_PROJECT_NAME:-smartprice-admin}

services:
  admin:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    networks:
      default: {}
      edge:
        aliases:
          - ${API_EDGE_ALIAS:-smartprice-admin}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true
    name: edge
